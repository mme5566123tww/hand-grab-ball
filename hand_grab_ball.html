<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>手抓球</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body {
    color: #f3efe6;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  video { display: none; }
  #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }

  /* 狀態標籤 */
  #status {
    position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 16px;
    font-size: 15px; font-weight: 600; padding: 7px 14px;
    border-radius: 999px; background: rgba(0,0,0,.5); backdrop-filter: blur(6px);
    pointer-events: none;
  }

  /* 底部控制列 */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;
    background: linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0));
    font-size: 14px;
  }
  #bar label { display: flex; align-items: center; gap: 6px; padding: 8px 12px;
    border-radius: 999px; background: rgba(0,0,0,.45); backdrop-filter: blur(6px); cursor: pointer; }
  #bar button { font: inherit; font-weight: 600; color: #fff; background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 8px 16px; cursor: pointer; backdrop-filter: blur(6px); }

  /* 開始畫面 */
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 32px;
    background: #14213d;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 30px; font-weight: 700; letter-spacing: .06em; }
  #overlay p { color: #b8c0d4; line-height: 1.7; max-width: 34ch; }
  #start { font: inherit; font-size: 18px; font-weight: 700; color: #14213d; background: #f3efe6;
    border: 0; border-radius: 999px; padding: 14px 36px; cursor: pointer; }
  #err { color: #fca5a5; font-size: 14px; }
</style>
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>
  <div id="status">尚未啟動</div>

  <div id="bar">
    <label><input type="checkbox" id="showCam" checked> 鏡頭畫面</label>
    <label><input type="checkbox" id="gravity" checked> 重力</label>
    <button id="reset">球回中間</button>
  </div>

  <div id="overlay">
    <h1>手抓球</h1>
    <p>把手放到鏡頭前，畫面裡的手會跟著你動。<br>手張開靠近球，握拳就能抓住；張開手就放開。</p>
    <button id="start">開啟鏡頭</button>
    <p id="err"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const overlay = document.getElementById('overlay');
    const errEl = document.getElementById('err');
    const showCam = document.getElementById('showCam');
    const gravityBox = document.getElementById('gravity');

    // 畫布 = 整個螢幕
    let W = 0, H = 0;
    // 鏡頭影像以「填滿裁切」方式鋪滿螢幕（像相機 App），這是影像實際貼上的位置
    let view = { x: 0, y: 0, w: 0, h: 0 };
    let BALL_R = 40;

    const CLOSE_RATIO = 1.45;
    const GRAVITY = 0.6, BOUNCE = 0.6;
    const grabDist = () => BALL_R * 2.2;

    // 球用「相對比例」儲存，螢幕轉向或改變大小時位置不會跑掉
    let ball = { fx: 0.5, fy: 0.5, vx: 0, vy: 0, held: false };
    let prevPalm = null;

    const CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
      [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]
    ];

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.width = Math.round(window.innerWidth * dpr);
      H = canvas.height = Math.round(window.innerHeight * dpr);
      BALL_R = Math.round(Math.min(W, H) * 0.07);
      layoutVideo();
    }

    function layoutVideo() {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) { view = { x: 0, y: 0, w: W, h: H }; return; }
      const s = Math.max(W / vw, H / vh);   // cover：放大到填滿並裁掉多餘部分
      view.w = vw * s; view.h = vh * s;
      view.x = (W - view.w) / 2; view.y = (H - view.h) / 2;
    }

    // MediaPipe 的座標是相對於鏡頭影像 (0~1)，轉成螢幕座標（含鏡像）
    const toScreen = p => ({ x: view.x + (1 - p.x) * view.w, y: view.y + p.y * view.h });

    function palmCenter(lm) {
      const ids = [0, 5, 9, 13, 17];
      let x = 0, y = 0;
      for (const i of ids) { x += lm[i].x; y += lm[i].y; }
      return toScreen({ x: x / ids.length, y: y / ids.length });
    }

    function isClosed(lm) {
      const wrist = lm[0];
      const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      const tips = [8, 12, 16, 20], bases = [5, 9, 13, 17];
      let sum = 0;
      for (let i = 0; i < 4; i++) sum += d(lm[tips[i]], wrist) / (d(lm[bases[i]], wrist) + 1e-6);
      return sum / 4 < CLOSE_RATIO;
    }

    function drawHand(lm, color) {
      const k = Math.max(1, Math.min(W, H) / 400);
      ctx.lineWidth = 4 * k; ctx.strokeStyle = '#fff'; ctx.lineCap = 'round';
      for (const [a, b] of CONNECTIONS) {
        const p = toScreen(lm[a]), q = toScreen(lm[b]);
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      }
      ctx.fillStyle = color;
      for (let i = 0; i < 21; i++) {
        const p = toScreen(lm[i]);
        ctx.beginPath(); ctx.arc(p.x, p.y, (i % 4 === 0 && i > 0 ? 8 : 5) * k, 0, Math.PI * 2); ctx.fill();
      }
    }

    function drawBall(bx, by) {
      ctx.beginPath(); ctx.arc(bx, by, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = ball.held ? '#7dd3fc' : '#ff6b4a'; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
      ctx.beginPath(); ctx.arc(bx - BALL_R * .3, by - BALL_R * .3, BALL_R * .26, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill();
    }

    function physics() {
      if (ball.held) return;
      let bx = ball.fx * W, by = ball.fy * H;
      if (gravityBox.checked) ball.vy += GRAVITY * (H / 720);
      bx += ball.vx; by += ball.vy; ball.vx *= 0.995;
      if (by + BALL_R > H) { by = H - BALL_R; ball.vy = -ball.vy * BOUNCE; if (Math.abs(ball.vy) < 1) ball.vy = 0; }
      if (by - BALL_R < 0) { by = BALL_R; ball.vy = -ball.vy * BOUNCE; }
      if (bx - BALL_R < 0) { bx = BALL_R; ball.vx = -ball.vx * BOUNCE; }
      if (bx + BALL_R > W) { bx = W - BALL_R; ball.vx = -ball.vx * BOUNCE; }
      ball.fx = bx / W; ball.fy = by / H;
    }

    function onResults(results) {
      ctx.clearRect(0, 0, W, H);
      if (showCam.checked) {
        ctx.save();
        ctx.translate(W, 0); ctx.scale(-1, 1);  // 鏡像
        ctx.drawImage(results.image, W - view.x - view.w, view.y, view.w, view.h);
        ctx.restore();
      } else {
        ctx.fillStyle = '#14213d'; ctx.fillRect(0, 0, W, H);
      }

      let palm = null, closed = false;
      if (results.multiHandLandmarks && results.multiHandLandmarks.length) {
        const lm = results.multiHandLandmarks[0];
        palm = palmCenter(lm);
        closed = isClosed(lm);
        drawHand(lm, closed ? '#fbbf24' : '#4ade80');
        ctx.beginPath(); ctx.arc(palm.x, palm.y, BALL_R * .25, 0, Math.PI * 2);
        ctx.fillStyle = closed ? '#fbbf24' : '#4ade80'; ctx.fill();
      }

      let bx = ball.fx * W, by = ball.fy * H;
      if (palm) {
        const dist = Math.hypot(palm.x - bx, palm.y - by);
        if (!ball.held && closed && dist < grabDist()) ball.held = true;
        if (ball.held && !closed) {
          ball.held = false;
          if (prevPalm) { ball.vx = (palm.x - prevPalm.x) * 0.8; ball.vy = (palm.y - prevPalm.y) * 0.8; }
        }
        if (ball.held) { ball.fx = palm.x / W; ball.fy = palm.y / H; }
        prevPalm = palm;
      } else { ball.held = false; prevPalm = null; }

      physics();
      drawBall(ball.fx * W, ball.fy * H);

      statusEl.textContent = !palm ? '找不到手' : ball.held ? '抓住球了' : closed ? '握拳' : '手張開';
      statusEl.style.color = ball.held ? '#7dd3fc' : closed ? '#fbbf24' : palm ? '#4ade80' : '#fff';
    }

    const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
    hands.onResults(onResults);

    let running = false, busy = false;
    async function loop() {
      if (!running) return;
      if (video.readyState >= 2 && !busy) {
        busy = true;
        try { await hands.send({ image: video }); } finally { busy = false; }
      }
      requestAnimationFrame(loop);
    }

    document.getElementById('start').addEventListener('click', async () => {
      errEl.textContent = '';
      try {
        const portrait = window.innerHeight > window.innerWidth;
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user',
                   width: { ideal: portrait ? 720 : 1280 },
                   height: { ideal: portrait ? 1280 : 720 } },
          audio: false
        });
        video.srcObject = stream;
        await new Promise(r => video.onloadedmetadata = r);
        await video.play();
        resize();
        overlay.classList.add('hidden');
        statusEl.textContent = '載入模型中…';
        running = true;
        loop();
        // 手機瀏覽器全螢幕（若支援）
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
      } catch (e) {
        errEl.textContent = '無法開啟鏡頭：' + (e.message || e);
      }
    });

    document.getElementById('reset').addEventListener('click', () => {
      ball = { fx: 0.5, fy: 0.5, vx: 0, vy: 0, held: false };
    });

    window.addEventListener('resize', resize);
    if (screen.orientation) screen.orientation.addEventListener('change', () => setTimeout(resize, 300));
    video.addEventListener('resize', layoutVideo);   // 鏡頭轉向後解析度改變
    resize();
  </script>
</body>
</html>
